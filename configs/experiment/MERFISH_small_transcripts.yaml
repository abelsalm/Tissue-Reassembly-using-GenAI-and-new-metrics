# @package _global_
general:
    name : 'MERFISH_small_transcripts'
    mode : 'train_and_test' # 'train_and_test' # 'test_only' # 

distribute:
    gpus_per_node: 4  # 1 = auto-detect one device (works on CPU-only machines)

dataset:
    dataset_name: 'MERFISH_small_cortex'
    gene_columns_start: 0   # first column after the index is a gene
    gene_columns_end: 254    #
    train_data_path: "/home/abel/biodata/MERFISH_LUNA_small_cortex/MERFISH_mouse_cortex_train.csv"
    test_data_path: "/home/abel/biodata/MERFISH_LUNA_small_cortex/MERFISH_mouse_cortex_test.csv"
    validation_data_path: "/home/abel/biodata/MERFISH_LUNA_small_cortex/MERFISH_mouse_cortex_test.csv"
    maximum_graph_size:
        train:  null   # downsample graphs to fit in CPU RAM; set null for full graphs on GPU
        test: null
        validation: null

train: # !!!!
    n_epochs: 5000     # tiny number for a smoke-test; increase for real training
    batch_size: 4     # keep small on CPU
    lr: 5e-4

test:
    save_dir: '/home/abel/code/code_outputs'
    checkpoint_paths: null
    #-  '/home/abel/code/outputs/2026-08-01/13-30-29-MERFISH_small_transcripts/checkpoints/epoch=1823.ckpt'
    #-  '/home/abel/code/outputs/2026-07-29/18-26-19-MERFISH_small_transcripts/checkpoints/last_epoch.ckpt'
    #- '/home/abel/code/outputs/2026-07-23/14-25-33-MERFISH_small_transcripts/checkpoints/last_epoch.ckpt'
    #- '/home/abel/code/outputs/2026-07-23/16-04-16-MERFISH_small_transcripts/checkpoints/epoch=2959.ckpt'
    #- '/home/abel/code/outputs/2026-07-23/17-30-20-MERFISH_small_transcripts/checkpoints/epoch=2959.ckpt'
    checkpoints_parent_dir: null #'/home/abel/code/outputs/2026-07-20/14-51-45-MERFISH_small_transcripts/checkpoints'
    checkpoints_name_list: 'all'

validation: # !!!!
    if_validate: True
    save_model_every_n_epochs: 1000  # save every epoch during the smoke-test