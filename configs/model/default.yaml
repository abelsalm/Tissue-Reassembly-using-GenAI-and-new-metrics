n_layers: 8 # Number of transformer layers
diffusion_noise_schedule: cosine # noise schedule for diffusion time
diffusion_steps: 1000 # number of diffusion steps
nu:
    p: 2
hidden_mlp_dims:
    X: 384 # hidden dimension of the MLP for cellular features
    y: 256 # hidden dimension of the MLP for diffusion time
    pos: 64 # hidden dimension of the MLP for position
hidden_dims:
    dx: 64 # hidden dimension of the MLP for cellular features
    dy: 1 # hidden dimension of the MLP for diffusion time
    num_heads: 16 # number of heads in the multi-head attention
    dim_ffX: 384 # hidden dimension of the cellular features feedforward network in the transformer
    dim_ffy: 256 # hidden dimension of the diffusion time feedforward network in the transformer
    dd: 64 # hidden dimension of the MLP for positions
    output_features_to_pos_dims: 4 # hidden dimension of the MLP for the output features to positions2048

# Optional biological conditioning concatenated with the original LUNA
# transcriptome embedding and projected back to hidden_dims.dx.
embeddings:
    fusion_hidden_dim: 64
    fusion_dropout: 0.0
    cell_type:
        enabled: false
        dim: 32
        standardize: true
        pca_max_cells: 20000
        freeze: false
        mds_scale: mean
        mds_weighting: uniform
    domain:
        enabled: false
        dim: 32
        pool: mean
        attn_hidden: 32
        variable_attention: false
        standardize: true
        pca_max_cells: 20000
        freeze_pca: true

# Optional architecture for predicting one domain with feature-only full-slice
# context. Keep disabled for the unchanged section/domain LUNA architectures.
domain_context:
    enabled: false
    n_layers: 4
    num_heads: 16
    dim_feedforward: 384
    dropout: 0.1
    # linear is recommended for 20–40k-cell ABC slices. multihead uses
    # torch.nn.MultiheadAttention and has quadratic slice-memory complexity.
    encoder_attention_type: linear       # linear | multihead
    cross_attention_type: linear         # linear | multihead
    cross_attention_every: 1             # inject context after every LUNA layer
    cross_attention_layers: null          # optional zero-based explicit list
    cross_attention_dim_feedforward: 384
    cross_attention_dropout: 0.1
    # Classifier-free context dropout and sampling guidance.
    context_dropout: 0.1
    guidance_scale: 1.0
    # Validation ablation: shuffled context should increase target loss.
    shuffle_ablation: false
    # Optional legacy LUNA checkpoint used only to initialize compatible
    # target-decoder parameters when starting a new conditional run.
    initialize_from_checkpoint: null