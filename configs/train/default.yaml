n_epochs: 24000 # Number of epochs
batch_size: 2 # Batch size for training
lr: 8e-4 # Learning rate
lr_warmup_epochs: 200 # Linear LR warmup over n epochs: lr starts at lr/n and reaches lr at epoch n (0 = disabled).
fast_dev_run: False # If True, runs 1 batch of train, test and val to find any bugs
weight_decay: 1.0e-12
rechunk_every_n_epochs: 10 # Re-randomise chunk boundaries every N epochs (0 = disabled)
# --- Global smooth position warp (training augmentation) ------------
position_warp_augment: True # If True, apply one smooth warp field per epoch to all train cells.
position_warp_max_displacement: 0.05 # Max |displacement| in normalised coord units.
position_warp_max_angle_span: 1.5707963267948966 # Max direction variation (rad) over the domain; pi/2.
position_warp_grid_size: 8 # Control-grid resolution for the smooth warp field.
debug_print_shuffle_every_n_epochs: 10 # Print a shuffle canary every N epochs (0 = disabled)
debug_shuffle_row_index: 10 # Fixed row index to print after shuffle (0-based)
# --- Global combined loss weights (0 = term disabled, no compute) --------
#   L = transcriptome_multi_radius_weight * L_transcriptome_multi_radius
#     + ch_weight                         * L_ch_auc
#     + pca_weight                        * L_pca
#     + directional_weight                * L_directional
transcriptome_multi_radius_weight: 1.0 # Multi-radius neighborhood transcriptome loss.
ch_weight: 0.1 # Whole-slide Cahn-Hilliard energy-curve AUC loss.
pca_weight: 0.1 # Whole-slide PCA shape-descriptor loss.
directional_weight: 0.1 # Transcriptome-weighted local orientation coherence loss.
# --- Multi-radius neighborhood loss parameters (transcriptome_multi_radius_weight > 0) ----
# Compares
# neighborhood-averaged transcriptomes, log cell densities, and (optionally)
# pred-vs-GT neighborhood weighted sums per **annulus** (radii sorted ascending;
# each shell is ball(r_k) minus ball(r_{k-1}), not overlapping balls). Aggregated as
#   L = transcriptome_rmse(avg_pred, avg_gt)   # per-gene GT band: see tolerance below
#     + multi_radius_density_weight * |log d_pred - log d_gt|
#     + multi_radius_global_transcriptome_weight
#       * mean_{i,r} rmse(sum_pred(i,r), sum_gt(i,r)) / (scale * r)
# Transcriptome + global: per cell, per shell, per **gene** f, in-band loss ramps
# from full RMSE (epoch 0) to ~0 (epoch n+): sq *= (n-k)/n inside band at epoch k.
multi_radius_radii: [0.02, 0.04, 0.08, 0.16] # Outer radii of annuli (sorted internally); e.g. [0.04, 0.16] -> disk r<=0.04 and ring (0.04, 0.16].
multi_radius_density_weight: 0.0 # Relative weight of the log-density term vs. the transcriptome-RMSE term.
multi_radius_global_transcriptome_weight: 1.0 # Weight of pred-vs-GT neighborhood-sum RMSE (0 = disabled).
multi_radius_transcriptome_tolerance: [0.02, 0.06, 0.04, 0.02] # Per-shell GT band half-width per gene (same length/order as multi_radius_radii; scalar = same for all shells).
multi_radius_transcriptome_tolerance_soft_beta: 256.0 # Sigmoid sharpness for the per-gene tolerance gate; null = hard cutoff at band edge.
multi_radius_transcriptome_tolerance_warmup_epochs: 8000 # Epochs n to ramp band forgiveness: epoch k keeps (n-k)/n of in-band loss; 0 = full band from epoch 0.
multi_radius_loss_radius_scale: 512 # Global term only: per-radius divisor is this times r.
multi_radius_soft_beta: 256.0 # Sigmoid sharpness for soft neighborhood membership; null = hard cutoff (no gradient through positions; diagnostic only).
multi_radius_eps: 1.0e-6 # Numerical floor for sqrt + log + weight normalisation.
multi_radius_include_self: True # Include cell i itself in its own neighborhood when averaging / counting.
# --- PCA sub-component mix (relative weights inside L_pca; only used when pca_weight > 0) ----
pca_anisotropy_weight: 1.0 # Relative weight of anisotropy term inside L_pca.
pca_omnivariance_weight: 1.0 # Relative weight of omnivariance term inside L_pca.
pca_linearity_weight: 1.0 # Relative weight of linearity term inside L_pca.
# --- Cahn-Hilliard AUC parameters (only used when ch_weight > 0) ----
ch_radii: [0.001, 0.0022857143, 0.0035714286, 0.0048571429, 0.0061428571, 0.0074285714, 0.0087142857, 0.01] # Radii for CH AUC integration.
ch_grid_resolution: 512 # CH landscape grid resolution.
ch_kappa: 0.5 # CH kappa.
ch_soft_max_beta: 32.0 # Soft-max beta for landscape combination.
ch_support_factor: 8 # Bump support factor.
ch_landscape_chunk_size: 128 # Chunk size for landscape construction.
ch_square_bbox: True # Use a square bounding box for the CH grid.
ch_margin: 0.01 # Margin around the point cloud for the CH grid.
ch_eps: 1.0e-6 # Numerical floor for CH AUC normalisation.
ch_min_cells: 10 # Minimum masked cells required to compute CH / PCA metrics.
ch_cache_gt: True # Cache GT CH AUC per sample (cleared each epoch).
# --- PCA parameters (only used when pca_weight > 0) ----
pca_min_cells: 10 # Minimum masked cells required to compute PCA descriptors.
pca_eps: 1.0e-6 # Numerical floor for PCA eigenvalue descriptors.
# --- Directional loss parameters (only used when directional_weight > 0) ----
directional_n_target: 2000 # Number of target cells to subsample per batch item.
directional_neighbor_radius: 0.12 # Spatial radius for first-pass axis computation.
directional_coherence_radius: 0.12 # Spatial radius for second-pass axis smoothing.
directional_trans_beta: 32.0 # Transcriptomic decay rate (exp(-beta * d_trans)).
directional_soft_beta: 256.0 # Sigmoid sharpness for soft spatial membership.
directional_length_weight: 256.0 # Weight on per-cell axis-length matching.
directional_pairwise_weight: 1.0 # Weight on pairwise axis-angle matching.
directional_min_valid_targets: 2 # Minimum valid targets before loss is skipped.